apiVersion: v1
kind: ConfigMap
metadata:
  name: sumitbank-configmap
data:
  SPRING_PROFILES_ACTIVE: "prod"

  SPRING_CONFIG_IMPORT: "configserver:http://configserver:8888/"
  CONFIGSERVER_APPLICATION_NAME: "configserver"

  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver:8761/eureka/"
  EUREKA_APPLICATION_NAME: "eurekaserver"

  SPRING_ACCOUNTS_DATASOURCE_URL: "jdbc:mysql://accountsdb:3306/accountsdb"
  SPRING_ACCOUNTS_DATASOURCE_USERNAME: "root"
  SPRING_ACCOUNTS_DATASOURCE_PASSWORD: "root"
  SPRING_CARDS_DATASOURCE_URL: "jdbc:mysql://cardsdb:3306/cardsdb"
  SPRING_CARDS_DATASOURCE_USERNAME: "root"
  SPRING_CARDS_DATASOURCE_PASSWORD: "root"
  SPRING_LOANS_DATASOURCE_URL: "jdbc:mysql://loansdb:3306/loansdb"
  SPRING_LOANS_DATASOURCE_USERNAME: "root"
  SPRING_LOANS_DATASOURCE_PASSWORD: "root"

  ACCOUNTS_APPLICATION_NAME: "accounts"
  CARDS_APPLICATION_NAME: "cards"
  LOANS_APPLICATION_NAME: "loans"
  GATEWAY_APPLICATION_NAME: "gatewayserver"
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: "http://keycloak:7080/realms/master/protocol/openid-connect/certs"



