apiVersion: apps/v1
kind: Deployment                                  # Defines a Deployment (to manage the ReplicaSets)
metadata:
  name: accounts-deployment                       # Name of the Deployment
  labels:
    app: accounts                                 # Deployment label (for identification)
spec:
  replicas: 1                                     # Desired number of Pods
  selector:
    matchLabels:
      app: accounts                               # Deployment selector, used by deployment to find the pods where app=accounts. Deployment says: I will manage ONLY Pods whose label is app=accounts
  template:
    metadata:
      labels:
        app: accounts                             # Pod label (used by Deployment (via ReplicaSet) to find Pods)
    spec:
      containers:
        - name: accounts                            # Container name inside the Pod
          image: sumitmittal2022/accounts:1.0       # Docker image of account MS
          ports:
            - containerPort: 8080                   # container will start internally on this port (should be same as target port of service)
          env:

            - name: SPRING_APPLICATION_NAME
              valueFrom:
                configMapKeyRef:
                  name: sumitbank-configmap
                  key: ACCOUNTS_APPLICATION_NAME

            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: sumitbank-configmap
                  key: SPRING_PROFILES_ACTIVE

            - name: SPRING_CONFIG_IMPORT
              valueFrom:
                configMapKeyRef:
                  name: sumitbank-configmap
                  key: SPRING_CONFIG_IMPORT

            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: sumitbank-configmap
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE

            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: sumitbank-configmap
                  key: SPRING_ACCOUNTS_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: sumitbank-configmap
                  key: SPRING_ACCOUNTS_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: sumitbank-configmap
                  key: SPRING_ACCOUNTS_DATASOURCE_PASSWORD

            # ✅ Prevent startup failure if DB is slow
            - name: SPRING_SQL_INIT_MODE
              value: "never"
---
apiVersion: v1
kind: Service                                     # Defines a Service (to provide network access to our Pods)
metadata:
  name: accounts                                  # Service name (DNS: accounts)
spec:
  selector:
    app: accounts                                 # service label (Selects Pods with this label)
  type: LoadBalancer                              # Exposes service outside the cluster
  ports:
    - protocol: TCP
      port: 8080                                  # k8s pod will be exposed to outside world on this port
      targetPort: 8080                            # k8s pod/container will start on this port