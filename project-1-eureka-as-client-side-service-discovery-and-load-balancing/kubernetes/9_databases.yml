##########################################################################
# Accounts DB
##########################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accountsdb
  labels:
    app: accountsdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accountsdb
  template:
    metadata:
      labels:
        app: accountsdb
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: sumitbank-configmap
                  key: MYSQL_ACCOUNTS_DATABASE_NAME
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sumitbank-secret
                  key: MYSQL_ACCOUNTS_DATABASE_PASSWORD
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          emptyDir: {}   # ephemeral storage, replace with PVC in production
---
apiVersion: v1
kind: Service
metadata:
  name: accountsdb
spec:
  selector:
    app: accountsdb
  type: NodePort
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30306


