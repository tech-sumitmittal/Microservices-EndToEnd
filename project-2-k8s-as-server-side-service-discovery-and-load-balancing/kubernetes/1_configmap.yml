apiVersion: v1
kind: ConfigMap
metadata:
  name: sumitbank-configmap
data:
  # Spring profile
  SPRING_PROFILES_ACTIVE: "prod"

  # Redis (Gateway Rate Limiter)
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_CONNECT_TIMEOUT: "3s"
  SPRING_DATA_REDIS_TIMEOUT: "5s"

  # RabbitMQ (Spring cloud bus for Refresh Config)
  RABBITMQ_HOST: "rabbit"
  RABBITMQ_PORT: "5672"

  # Kafka (Event driven microservices)
  SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: "kafka:9092"

  # Config Server
  SPRING_CONFIG_IMPORT: "optional:configserver:http://configserver:8888/"
  CONFIGSERVER_APPLICATION_NAME: "configserver"

  # Keycloak (internal k8s service)
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: "http://keycloak:7080/realms/master/protocol/openid-connect/certs"

  # Databases
  MYSQL_ACCOUNTS_DATABASE_URL: "jdbc:mysql://accountsdb:3306/accountsdb"
  MYSQL_ACCOUNTS_DATABASE_NAME: "accountsdb"

  MYSQL_CARDS_DATABASE_URL: "jdbc:mysql://cardsdb:3306/cardsdb"
  MYSQL_CARDS_DATABASE_NAME: "cardsdb"

  MYSQL_LOANS_DATABASE_URL: "jdbc:mysql://loansdb:3306/loansdb"
  MYSQL_LOANS_DATABASE_NAME: "loansdb"

  # MS
  ACCOUNTS_APPLICATION_NAME: "accounts"
  CARDS_APPLICATION_NAME: "cards"
  LOANS_APPLICATION_NAME: "loans"
  GATEWAY_APPLICATION_NAME: "gatewayserver"